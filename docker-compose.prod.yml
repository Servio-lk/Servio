# =============================================================
# Servio — Production Docker Compose (AWS Free Tier / EC2)
# =============================================================
# Orchestrates production services on AWS EC2 t3.micro.
#
# Usage Options:
#   1. Backend only (when Frontend is hosted on S3 + CloudFront):
#      docker compose -f docker-compose.prod.yml --env-file .env up -d
#
#   2. Full Stack on EC2 (Backend + Dual-Port Nginx Frontend):
#      docker compose -f docker-compose.prod.yml --env-file .env --profile all up -d --build
# =============================================================

services:
  # Backend API (Spring Boot)
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/servio-lk/servio-backend:latest}
    container_name: servio-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Database (Supabase Session Pooler recommended for IPv4)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-6543}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SSLMODE=${DB_SSLMODE:-require}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-604800000}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # CORS & Client URLs
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:8081,http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:80,http://localhost:8081}
      # PayHere Payment Gateway
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID:-1219999}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET:-}
      - PAYHERE_SANDBOX=${PAYHERE_SANDBOX:-false}
      - PAYHERE_NOTIFY_URL=${PAYHERE_NOTIFY_URL:-}
      # Cloudinary Media Storage
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Google Gemini AI Assistant
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - PORT=${BACKEND_PORT:-3001}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    mem_limit: 700m
    memswap_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - servio-network

  # Frontend (React/Vite via Nginx) — Serves Customer Portal (port 80) and Admin Portal (port 8081)
  # Active when running full-stack on EC2: --profile all or --profile frontend
  frontend:
    profiles: ["all", "frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: servio-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
      - "${ADMIN_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - servio-network

networks:
  servio-network:
    driver: bridge
