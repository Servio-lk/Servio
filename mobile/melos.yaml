name: servio_mobile

packages:
  - apps/*
  - packages/*

scripts:
  analyze:
    run: melos exec -- "flutter analyze"
    description: Run `flutter analyze` in all packages.
  
  test:
    run: melos exec --dir-exists="test" -- "flutter test"
    description: Run `flutter test` in all packages.

  build:runner:
    run: melos exec --depends-on="build_runner" -- "dart run build_runner build --delete-conflicting-outputs"
    description: Run `build_runner build` in all packages that depend on it.

  run:customer:
    run: cd apps/customer_app && flutter run --dart-define-from-file=../../.env
    description: Run Customer App with environment variables from root .env.

  run:mechanic:
    run: cd apps/mechanic_app && flutter run --dart-define-from-file=../../.env
    description: Run Mechanic App with environment variables from root .env.

