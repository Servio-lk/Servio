# Development Profile

# Server Configuration
server.port=${PORT:3001}
server.servlet.context-path=/

# Embedded H2 database for local development
spring.datasource.url=jdbc:h2:mem:servio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Logging
logging.level.root=INFO
logging.level.com.servio=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# CORS Configurations - Add the network IP for mobile/LAN testing
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://localhost}

# DevTools
spring.devtools.restart.enabled=true

spring.flyway.enabled=false

payhere.merchant.id=${PAYHERE_MERCHANT_ID:1219999}
payhere.merchant.secret=${PAYHERE_MERCHANT_SECRET:}
payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.notify.url=${PAYHERE_NOTIFY_URL:http://localhost:3001/api/payments/payhere/notify}
app.frontend.url=${FRONTEND_APP_URL:${FRONTEND_URL:http://localhost:5173}}

supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.h2.console.enabled=false