# Development Profile
# Note: Database and Supabase credentials are read from application.properties
# and environment variables (.env), so live PostgreSQL data is used in all environments.

# DevTools
spring.devtools.restart.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.servio=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
